server:
  port: 8084
spring:
  application:
    name: sub
  cloud:
    function:
      definition: consumeCourse;consumeMessage
    stream:
      function:
        definition: consumeCourse;consumeMessage
      bindings:
        consumeCourse-in-0:
          destination: mw1
        consumeMessage-in-0:
          destination: mw2

      kafka:
        binder:
          brokers: localhost:9092

