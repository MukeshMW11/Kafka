server:
  port: 8082

spring:
  application:
    name: pub
  cloud:
    function:
      definition: courseSupplier
    stream:
      function:
        definition: courseSupplier
      binding:
        courseSupplier-out-0:
          destination: mw1
          content-type: application/json
      poller:
        fixed-delay: 5000
      kafka:
        binder:
          brokers: localhost:9092






